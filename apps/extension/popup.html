<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HireShield</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; width: 300px; padding: 15px; margin: 0; background: #0f172a; color: white; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #2563eb; }
        #result { margin-top: 15px; font-size: 14px; }
        .score { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .high-risk { color: #ef4444; }
        .low-risk { color: #22c55e; }
        .medium-risk { color: #eab308; }
        ul { padding-left: 20px; }
    </style>
</head>
<body>
    <h3>🛡️ HireShield</h3>
    <p>Analyze current job posting.</p>
    <button id="analyzeBtn">Scan Job</button>
    <div id="result"></div>
    <script>
        document.getElementById('analyzeBtn').addEventListener('click', async () => {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "Scanning...";
            
            const [tab] = await chrome.tabs.query({active: true, currentWindow: true});
            
            chrome.tabs.sendMessage(tab.id, {action: "extract"}, (jobData) => {
                if (!jobData) {
                    resultDiv.innerHTML = "Could not extract job data from this page.";
                    return;
                }
                
                chrome.runtime.sendMessage({action: "analyzeJob", jobData}, (response) => {
                    if (response.error) {
                        resultDiv.innerHTML = `<span style="color: red;">${response.error}</span>`;
                        return;
                    }
                    const data = response.result;
                    let riskClass = data.risk_level === 'High' ? 'high-risk' : (data.risk_level === 'Low' ? 'low-risk' : 'medium-risk');
                    let html = `<div class="score ${riskClass}">Risk: ${data.risk_level} (${Math.round(data.fraud_probability * 100)}%)</div>`;
                    
                    if (data.red_flags.length > 0) {
                        html += `<b>Red Flags:</b><ul>`;
                        data.red_flags.forEach(flag => {
                            html += `<li>${flag}</li>`;
                        });
                        html += `</ul>`;
                    } else {
                        html += `<p>No obvious red flags detected.</p>`;
                    }
                    resultDiv.innerHTML = html;
                });
            });
        });
    </script>
</body>
</html>
