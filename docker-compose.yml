version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hireshield_user
      POSTGRES_PASSWORD: hireshield_password
      POSTGRES_DB: hireshield_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hireshield_network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hireshield_network

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: hireshield_admin
      MONGO_INITDB_ROOT_PASSWORD: hireshield_password
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - hireshield_network

volumes:
  postgres_data:
  redis_data:
  mongodb_data:

networks:
  hireshield_network:
    driver: bridge
